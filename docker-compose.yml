services:
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsapp_crm
    ports:
      - "5432:5432"
    volumes:
      - whatsapp_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  whatsapp_crm_pgdata:
